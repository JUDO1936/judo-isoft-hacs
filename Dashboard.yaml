views:
  - title: i-soft PRO
    path: isoft-pro
    icon: mdi:water-softener
    cards:
      - type: entities
        title: Anlage & Infodaten
        icon: mdi:information-outline
        show_header_toggle: false
        entities:
          - entity: sensor.i_soft_pro_status_2
            name: Status
            icon: mdi:water-softener
          - entity: sensor.i_soft_geraetetyp_hex
            name: Gerätetyp
            icon: mdi:chip
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_firmware_version
            name: Firmware Version
            icon: mdi:numeric
          - entity: update.judo_i_soft_pro_l_integration_update
            name: Software Status
            icon: mdi:calendar-check
      - type: entities
        title: Leckageschutz & Urlaubsmodus
        icon: mdi:shield-water
        entities:
          - entity: button.test_gerat_schreibtisch_i_soft_pro_leckageschutz_schliessen
            name: Leckageschutz schließen
            icon: mdi:valve-closed
          - entity: button.test_gerat_schreibtisch_i_soft_pro_leckageschutz_offnen
            name: Leckageschutz öffnen
            icon: mdi:valve-open
          - type: section
          - entity: number.test_gerat_schreibtisch_i_soft_pro_urlaubsmodus_dauer
            name: Urlaubstage
      - type: entities
        title: Wasserhärte Einstellungen
        icon: mdi:water-percent
        entities:
          - entity: >-
              number.test_gerat_schreibtisch_i_soft_pro_wunschwasserharte_einstellen
            name: Wunschwasserhärte
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_wunschwasserharte
            name: Aktuell am Gerät
          - type: section
          - entity: input_select.isoft_haerteeinheit_auswahl
            name: Einheiten-Auswahl
          - entity: sensor.i_soft_haerteeinheit
            name: Aktuelle Härte am Gerät
      - type: entities
        title: Szenen & Regeneration
        icon: mdi:palette
        entities:
          - entity: input_select.isoft_szene_auswahl
            name: Szene
          - entity: number.test_gerat_schreibtisch_i_soft_pro_szenendauer_einstellen
            name: Dauer
          - type: section
          - entity: button.test_gerat_schreibtisch_i_soft_pro_regeneration_starten
            name: Manuelle Regeneration
            icon: mdi:autorenew
      - type: entities
        title: Grenzwerte - Leckageschutz
        icon: mdi:shield-alert
        entities:
          - entity: >-
              number.test_gerat_schreibtisch_i_soft_pro_max_entnahmedauer_einstellen
            name: Max. Entnahmedauer
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_max_entnahmedauer
            name: Gerät - Entnahmedauer
          - type: section
          - entity: >-
              number.test_gerat_schreibtisch_i_soft_pro_max_entnahmemenge_einstellen
            name: Max. Entnahmemenge
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_max_entnahmemenge
            name: Gerät - Entnahmemenge
          - type: section
          - entity: >-
              number.test_gerat_schreibtisch_i_soft_pro_max_volumenstrom_einstellen
            name: Max. Volumenstrom
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_max_volumenstrom
            name: Gerät - Volumenstrom
      - type: entities
        title: Salzvorrat & Warnschwelle
        icon: mdi:salt-shaker
        show_header_toggle: false
        entities:
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_salzgewicht
            name: Salzvorrat
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_salzreichweite
            name: Reichweite
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_salzmangel_warnschwelle
            name: Gerät - Warnschwelle
          - type: section
          - entity: input_number.isoft_salzmangel_warnung_eingabe
            name: Warnung ab (Tage)
      - type: entities
        title: Wasser & Verbrauch
        icon: mdi:water
        entities:
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_gesamtwassermenge
            name: Gesamtwassermenge
          - entity: sensor.test_gerat_schreibtisch_i_soft_pro_weichwassermenge
            name: Weichwassermenge
      - type: history-graph
        entities:
          - entity: sensor.i_soft_gesamtwassermenge
            name: Gesamtwassermenge
          - entity: sensor.i_soft_weichwassermenge
            name: Weichwassermenge
        title: Verlauf Gesamtwasserverbrauch (7 Tage)
        hours_to_show: 168
        show_names: true
        logarithmic_scale: false
        expand_legend: false
