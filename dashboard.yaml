title: JUDO i-soft PRO
views:
  - title: Übersicht
    path: judo
    icon: mdi:water-softener
    cards:
      - type: markdown
        content: |
          # JUDO i-soft PRO / PRO L
          Lokale REST-Überwachung und Steuerung
      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.judo_isoft_pro_verbindungsstatus
            name: Verbindung
          - type: tile
            entity: sensor.judo_isoft_pro_geraetetyp
            name: Gerät
          - type: tile
            entity: sensor.judo_isoft_pro_software_version
            name: Software
          - type: tile
            entity: sensor.judo_isoft_pro_betriebsstunden
            name: Betriebsstunden
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.judo_isoft_pro_gesamtwassermenge
            name: Gesamtwasser
            icon: mdi:water
          - type: tile
            entity: sensor.judo_isoft_pro_weichwassermenge
            name: Weichwasser
            icon: mdi:water-outline
      - type: statistics-graph
        title: Wasserzähler
        chart_type: line
        period: month
        stat_types:
          - state
        entities:
          - sensor.judo_isoft_pro_gesamtwassermenge
          - sensor.judo_isoft_pro_weichwassermenge
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.judo_isoft_pro_salzgewicht
            name: Salzgewicht
            icon: mdi:sack
          - type: tile
            entity: sensor.judo_isoft_pro_salzreichweite
            name: Salzreichweite
            icon: mdi:calendar-clock

  - title: Steuerung
    path: steuerung
    icon: mdi:tune-variant
    cards:
      - type: markdown
        content: |
          ## Szenensteuerung
          Szene und Dauer auswählen und anschließend aktivieren.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Szene
            show_header_toggle: false
            entities:
              - entity: select.judo_isoft_pro_szenenauswahl
                name: Szenenauswahl
              - entity: select.judo_isoft_pro_szenendauer
                name: Szenendauer
          - type: button
            entity: button.judo_isoft_pro_szene_aktivieren
            name: Szene aktivieren
            icon: mdi:play-circle
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.judo_isoft_pro_szene_aktivieren
      - type: markdown
        content: |
          ## Leckageschutz
          **EIN** öffnet den Leckageschutz, **AUS** schließt ihn.
      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: switch.judo_isoft_pro_leckageschutz
            name: Leckageschutz
          - type: button
            entity: button.judo_isoft_pro_leckageschutz_offnen
            name: Öffnen
            icon: mdi:valve-open
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.judo_isoft_pro_leckageschutz_offnen
          - type: button
            entity: button.judo_isoft_pro_leckageschutz_schliessen
            name: Schließen
            icon: mdi:valve-closed
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.judo_isoft_pro_leckageschutz_schliessen
      - type: button
        entity: button.judo_isoft_pro_regeneration_starten
        name: Regeneration starten
        icon: mdi:refresh
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.judo_isoft_pro_regeneration_starten
      - type: entities
        title: Einstellungen
        show_header_toggle: false
        entities:
          - entity: number.judo_isoft_pro_salzmangel_warnschwelle
            name: Salzmangel-Warnschwelle
            icon: mdi:alert-circle-outline
          - entity: number.judo_isoft_pro_wunschwasserharte
            name: Wunschwasserhärte
            icon: mdi:water-opacity
          - entity: select.judo_isoft_pro_harteeinheit
            name: Härteeinheit
            icon: mdi:format-letter-case
          - entity: number.judo_isoft_pro_max_entnahmedauer
            name: Max. Entnahmedauer
            icon: mdi:timer-outline
          - entity: number.judo_isoft_pro_max_entnahmemenge
            name: Max. Entnahmemenge
            icon: mdi:cup-water
          - entity: number.judo_isoft_pro_max_volumenstrom
            name: Max. Volumenstrom
            icon: mdi:water-pump
      - type: markdown
        content: |
          **Hinweis:** Änderungen an Einstellungen werden über die gleiche REST-Warteschlange wie die Leseabfragen gesendet. Danach wird der jeweilige Wert nach 5 Sekunden erneut gelesen.

  - title: 6900 / Diagnose
    path: diagnose
    icon: mdi:bug-check-outline
    cards:
      - type: markdown
        content: |
          ## Kommando 6900
          Das Kommando wird bereits alle 10 Minuten abgefragt. Die Antwort wird zusätzlich generisch als Bytes, 16-bit- und 32-bit-Little-Endian-Werte ausgewertet.
      - type: entities
        title: 6900 Daten
        show_header_toggle: false
        entities:
          - entity: sensor.judo_isoft_pro_6900_rohdaten
            name: Rohdaten HEX
          - entity: sensor.judo_isoft_pro_6900_byte_anzahl
            name: Byte-Anzahl
          - entity: sensor.judo_isoft_pro_6900_16_bit_werte
            name: 16-bit Werte
          - entity: sensor.judo_isoft_pro_6900_32_bit_werte
            name: 32-bit Werte
      - type: entities
        title: Gerätestatus
        show_header_toggle: false
        entities:
          - entity: sensor.judo_isoft_pro_verbindungsstatus
          - entity: sensor.judo_isoft_pro_geraetetyp
          - entity: sensor.judo_isoft_pro_software_version
          - entity: sensor.judo_isoft_pro_betriebsstunden
          - entity: sensor.judo_isoft_pro_inbetriebnahmedatum
      - type: markdown
        content: |
          ### Abfrageverhalten
          - maximal **1 REST-Kommando pro Sekunde**
          - Grundabfrage **alle 10 Minuten**
          - geänderte Einstellwerte werden nach **5 Sekunden** nachgeprüft
          - bei einer einzelnen fehlgeschlagenen Abfrage bleibt der letzte gültige Wert erhalten
          - ein nicht unterstütztes `6900` blockiert die übrigen Sensoren nicht
